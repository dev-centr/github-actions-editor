[package]
name = "github-actions-editor"
version = "0.1.0"
edition = "2021"
authors = ["AMDphreak"]
description = "A desktop GUI for editing GitHub Actions workflows with marketplace discovery"
license = "MIT"
repository = "https://github.com/amdphreak/github-actions-editor"

[dependencies]
# GUI Framework
iced = { version = "0.13", features = ["tokio", "advanced"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# GitHub API
octocrab = "0.41"
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Fuzzy Search
fuzzy-matcher = "0.3"

# Secure Credential Storage
keyring = "3"

# Caching & Storage
directories = "5"

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for cache keys
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true

