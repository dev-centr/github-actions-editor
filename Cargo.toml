[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AMDphreak"]
license = "MIT"
repository = "https://github.com/amdphreak/github-actions-editor"

[workspace.dependencies]
# GUI Framework
iced = { version = "0.13", features = ["tokio", "advanced"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# GitHub API
octocrab = "0.41"
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Fuzzy Search
fuzzy-matcher = "0.3"

# Secure Credential Storage
keyring = "3"

# Caching & Storage
directories = "5"

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for cache keys
uuid = { version = "1", features = ["v4"] }

[package]
name = "github-actions-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A desktop GUI for editing GitHub Actions workflows with marketplace discovery"

[dependencies]
iced.workspace = true
tokio.workspace = true
octocrab.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
fuzzy-matcher.workspace = true
keyring.workspace = true
directories.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true

[profile.release]
opt-level = 3
lto = true

